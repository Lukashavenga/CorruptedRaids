# Claude (Sonnet) picks up tickets.
#
# Two ways to hand it work, both deliberate on the operator's part:
#   - put the `claude` label on an issue, or
#   - mention @claude in an issue or PR comment (a follow-up, a correction).
# Opening an issue does NOT start it. Tickets get logged long before anyone
# has decided they should be worked, and a run on every new issue would spend
# money on plans nobody approved - the auction house is the example.
#
# It works on a branch of its own and comments with a link to open the PR.
# Nothing merges without a person.
#
# Needs, once, by hand (see the PR that added this file):
#   - the Claude GitHub app installed on this repository, and
#   - a repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`,
#     billed to a Claude subscription) or ANTHROPIC_API_KEY (billed to the API).
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the label and the mention start a run, and only from someone with
    # write access - the action checks that itself, this just avoids booting
    # a runner for every comment on the repo.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Installed up front so the verification chain in AGENTS.md section 9
      # can actually run. Without node_modules Claude can edit the code but
      # cannot typecheck, build or simulate it - and section 6 is explicit
      # that an unmeasured balance claim is not worth making.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix web
      # check:text is in the section 9 chain and needs Pillow. Without it every
      # run reported the check as "could not run", on the tickets that added copy.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools "Bash(npm run *),Bash(npm ci*),Bash(npx tsc *),Bash(npx tsx *),Bash(node *),Bash(git diff*),Bash(git status*),Bash(git log*)"
            --append-system-prompt "Read AGENTS.md before changing anything; it records why the code is the way it is, and several of its rules exist because breaking them already cost a stream. This runner is Linux: use npm/npx, not npm.cmd. Before calling a ticket done, run the section 9 chain: npm run typecheck && npx tsc --noEmit -p web/tsconfig.json && npm run build:web && npm run check:text && npm run simulate && npm run check:formations - and say in the PR which passed and which did not, with output. If you touch content/balance.json, formations or loot, also run npm run simulate:progression and quote the numbers that moved. Every new tunable number goes in content/balance.json and its schema, every new player-facing string in src/text/en.ts. Every state change goes through a GameCommand. If a ticket asks for a design decision it does not make, ask in the issue rather than guessing. This runner has no Supabase key, so studies read content/ on disk and the balance log cannot be read: say so beside any number you quote, and do not claim a result about live play."

      # The action hides Claude's output, and should: this repo is public and
      # the full transcript is readable by anyone. But a run that dies on its
      # first call ("encountered an error after 2s") then says nothing about
      # why. This prints the ONE line that does - the final result, which on a
      # failure is the API's error (expired token, unknown model, no access) -
      # and only when the step failed.
      - name: Why Claude failed
        if: failure()
        env:
          # The output is not always set when the action fails; this is where
          # it writes the log either way.
          LOG: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          [ -f "$LOG" ] || { echo "no execution log at $LOG"; exit 0; }
          jq -r '.[] | select(.type == "result") | .result // empty' "$LOG"
